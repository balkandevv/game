<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big City – Porsche 911 qnidevv</title>
<style>
:root{--hud-bg:rgba(255,248,238,.82);--hud-fg:#241b17;--btn:rgba(36,27,23,.5);--btn-fg:#fff;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hud-bg:rgba(20,22,30,.78);--hud-fg:#f4eee8;--btn:rgba(255,255,255,.28)}}
:root[data-theme="dark"]{--hud-bg:rgba(20,22,30,.78);--hud-fg:#f4eee8;--btn:rgba(255,255,255,.28)}
html,body{margin:0;height:100%;overflow:hidden;background:#e9a56f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
.hud{position:fixed;background:var(--hud-bg);color:var(--hud-fg);border-radius:14px;padding:10px 16px}
#speed{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#speed small{font-size:14px;font-weight:500;margin-left:6px}
#help{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;font-size:13px;line-height:1.5;max-width:270px}
#mm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 116px);left:12px;width:160px;height:160px;border-radius:50%;border:2px solid var(--hud-bg);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#speed{min-width:215px}#gear{font-size:22px;margin-left:12px}#rpmbar{height:6px;margin-top:9px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}#rpmfill{display:block;height:100%;width:2%}
#odo{font-size:12px;font-weight:500;margin-top:7px;line-height:1.2}#help{display:none}#help.show{display:block}
#mm.big{top:50%;left:50%;transform:translate(-50%,-50%);width:min(88vmin,580px);height:min(88vmin,580px);border-radius:14px;z-index:5}
#hint{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:12px;padding:6px 10px;border-radius:10px;background:var(--hud-bg);color:var(--hud-fg);transition:opacity .6s}
#hbtn{display:none}
@media (hover:none) and (pointer:coarse){#hint{display:none}#hbtn{display:block;position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);font-size:18px}#help{top:calc(env(safe-area-inset-top,0px) + 62px)}}
#pad{display:none}
@media (hover:none) and (pointer:coarse){
 #help{display:none}#pad{display:block}
 #pad button{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:76px;height:76px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);font-size:26px;touch-action:none}
 #bl{left:16px}#br{left:104px}#bg{right:16px}#bb{right:104px}
 #pad #bh{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 108px);width:64px;height:64px;font-size:18px}
}
</style>
</head>
<body>
<canvas id="mm"></canvas><div class="hud" id="speed"><div><span id="kmh">0</span><small>km/h</small><b id="gear">N</b></div><div id="rpmbar"><i id="rpmfill"></i></div><div id="odo"></div></div>
<button id="hbtn">?</button><div id="hint">H – controls</div><div class="hud" id="help">W / ↑ throttle<br>S / ↓ brake, reverse<br>A D / ← → steering<br>Space – handbrake drift<br>V – camera (outside / cockpit)<br>M – full map<br>C – paint colour · R – reset<br>H – hide this</div>
<div id="pad"><button id="bl" data-k="l">◀</button><button id="br" data-k="r">▶</button><button id="bg" data-k="g">▲</button><button id="bb" data-k="b">▼</button><button id="bh" data-k="h">drift</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T = THREE, C = h => new T.Color(h).convertSRGBToLinear();
const renderer = new T.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new T.Scene(), cam = new T.PerspectiveCamera(62, 1, 0.1, 900);
function resize(){ renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---- golden-hour sky + reflections ----
const SUN = new T.Vector3(-0.55, 0.26, 0.78).normalize();
const skyMat = new T.ShaderMaterial({side: T.BackSide, depthWrite: false, fog: false,
  uniforms: {top: {value: C(0x2a5598)}, mid: {value: C(0xf3a870)}, bot: {value: C(0x7a5d55)}, sun: {value: SUN}},
  vertexShader: 'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform vec3 top,mid,bot,sun;varying vec3 d;
void main(){float h=d.y;vec3 c=h>0.?mix(mid,top,pow(h,.45)):mix(mid,bot,pow(-h,.5));
float s=max(dot(d,sun),0.);c+=vec3(1.,.72,.4)*(pow(s,700.)*5.+pow(s,10.)*.4);gl_FragColor=vec4(c,1.);
#include <tonemapping_fragment>
#include <encodings_fragment>
}`});
const sky = new T.Mesh(new T.SphereGeometry(400, 32, 16), skyMat); scene.add(sky);
const envScene = new T.Scene(); envScene.add(new T.Mesh(new T.SphereGeometry(400, 32, 16), skyMat));
scene.environment = new T.PMREMGenerator(renderer).fromScene(envScene).texture;
scene.fog = new T.Fog(C(0xe5a478), 80, 450);
scene.add(new T.HemisphereLight(C(0xffd7b0), C(0x405030), 0.3));
const sun = new T.DirectionalLight(C(0xffc48a), 2.8);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
const sc = sun.shadow.camera; sc.left = sc.bottom = -80; sc.right = sc.top = 80; sc.far = 400;
scene.add(sun, sun.target);

// ---- helpers ----
const std = (c, r = 0.9, m = 0, x = {}) => new T.MeshStandardMaterial(Object.assign({color: C(c), roughness: r, metalness: m}, x));
const box = (w, h, d, m, x, y, z) => { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; return o; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function tex(draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d'));
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = 8; t.repeat.set(rx, ry); return t;
}
const speck = base => g => { g.fillStyle = base; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1500; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.15)'; g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } };

// ---- city (big map) ----
const P = 54, N = 6, CR = (N + 0.5) * P + 7, Rr = CR + 80, R = 1000, HW = 26, colliders = [], o = new T.Object3D(), ot = new T.Object3D();
const ground = new T.Mesh(new T.PlaneGeometry(4000, 4000), std(0xffffff, 1, 0, {map: tex(speck('#5b8a47'), 650, 650)}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function merge(gs) {
  let n = 0, m = 0; for (const g of gs) { n += g.attributes.position.count; m += g.index.count; }
  const pa = new Float32Array(n * 3), na = new Float32Array(n * 3), ua = new Float32Array(n * 2), ia = new Uint32Array(m); let a = 0, b = 0;
  for (const g of gs) {
    pa.set(g.attributes.position.array, a * 3); na.set(g.attributes.normal.array, a * 3); ua.set(g.attributes.uv.array, a * 2);
    const ix = g.index.array; for (let i = 0; i < ix.length; i++) ia[b + i] = ix[i] + a; a += g.attributes.position.count; b += ix.length;
  }
  const r = new T.BufferGeometry(); r.setAttribute('position', new T.BufferAttribute(pa, 3)); r.setAttribute('normal', new T.BufferAttribute(na, 3)); r.setAttribute('uv', new T.BufferAttribute(ua, 2)); r.setIndex(new T.BufferAttribute(ia, 1)); return r;
}
const fp = [], groups = new Map(), add = (m, g) => { if (!groups.has(m)) groups.set(m, []); groups.get(m).push(g); };
function addBox(m, w, h, d, x, y, z, rx = 1, ry = 1) {
  const g = new T.BoxGeometry(w, h, d), uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rx, uv.getY(i) * ry);
  g.translate(x, y, z); add(m, g);
}
function addRoof(m, w, d, x, y, z, h) { const g = new T.ConeGeometry(0.7637 * w, h, 4); g.rotateY(Math.PI / 4); g.scale(1, 1, d / w); g.translate(x, y + h / 2, z); add(m, g); }

const winSets = [0, 1, 2, 3, 4, 5].map(n => {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 128; return c; };
  const a = mk(), b = mk(), ga = a.getContext('2d'), gb = b.getContext('2d'), q = n < 4 ? 4 : 8, s = 128 / q;
  ga.fillStyle = n < 4 ? '#fff' : '#dfe8f2'; ga.fillRect(0, 0, 128, 128); gb.fillStyle = '#000'; gb.fillRect(0, 0, 128, 128);
  for (let y = 0; y < q; y++) for (let x = 0; x < q; x++) {
    const r = n < 4 ? [x * s + 6, y * s + 7, 20, 16] : [x * s + 1.5, y * s + 1.5, s - 3, s - 3];
    ga.fillStyle = n < 4 ? '#26364a' : '#3d5f84'; ga.fillRect(...r);
    if (Math.random() < (n < 4 ? 0.4 : 0.3)) { gb.fillStyle = '#ffc766'; gb.fillRect(...r); }
  }
  return [a, b].map(c => { const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 8; t.encoding = T.sRGBEncoding; return t; });
});
const bmat = {};
const BM = (col, set) => { const k = col + '_' + set, g = set > 3; return bmat[k] || (bmat[k] = std(col, g ? 0.18 : 0.75, g ? 0.7 : 0.05, {map: winSets[set][0], emissiveMap: winSets[set][1], emissive: new T.Color(1, 1, 1), emissiveIntensity: g ? 1.1 : 1.3})); };
const dark = std(0x4a4e55, 0.8), roofM = [std(0x9c4a38, 0.8), std(0x5c5f66, 0.8), std(0x7a3b2e, 0.8)];
const wallCols = [0xe3d9c8, 0xc3cdd8, 0xd9b08f, 0xb4c2aa, 0xe8d1ab, 0xa5afc2], glassCols = [0x7aa6c8, 0x6fb7b0, 0x8d9cc4], pastel = [0xf0e2c8, 0xe8c9b0, 0xc9d8c5, 0xd6d2e6, 0xf2d4d0, 0xe6e0b8];

// trees (instanced)
const MAXT = 4500, trunkG = new T.CylinderGeometry(0.25, 0.4, 2.4, 6); trunkG.translate(0, 1.2, 0);
const c1 = new T.ConeGeometry(2.4, 4, 8), c2 = new T.ConeGeometry(1.7, 3.4, 8); c1.translate(0, 3.6, 0); c2.translate(0, 5.6, 0);
const trunks = new T.InstancedMesh(trunkG, std(0x6b4a2f), MAXT), leaves = new T.InstancedMesh(merge([c1, c2]), std(0xffffff, 0.9), MAXT);
trunks.count = leaves.count = 0; trunks.frustumCulled = leaves.frustumCulled = false; leaves.castShadow = true; scene.add(trunks, leaves);
const tcol = C(0x2f7d3a), cl = new T.Color();
function tree(x, z) {
  if (leaves.count >= MAXT) return;
  const s = 0.8 + Math.random() * 0.7; ot.position.set(x, 0.3, z); ot.scale.set(s, s, s); ot.updateMatrix();
  trunks.setMatrixAt(leaves.count, ot.matrix); leaves.setMatrixAt(leaves.count, ot.matrix);
  leaves.setColorAt(leaves.count, cl.copy(tcol).offsetHSL((Math.random() - 0.5) * 0.06, 0, (Math.random() - 0.5) * 0.08));
  trunks.count = ++leaves.count; colliders.push({x, z, hw: 0.7 * s, hd: 0.7 * s});
}

// roads, lamps
const roadA = std(0xffffff, 0.95, 0, {map: tex(speck('#3d4047'), 2, 110)}), roadB = std(0xffffff, 0.95, 0, {map: tex(speck('#3d4047'), 110, 2)});
const hwA = std(0xffffff, 0.95, 0, {map: tex(speck('#33363b'), 3, 110)}), hwB = std(0xffffff, 0.95, 0, {map: tex(speck('#33363b'), 110, 3)});
const dash = new T.InstancedMesh(new T.BoxGeometry(0.4, 0.02, 3.5), new T.MeshBasicMaterial({color: C(0xf2e6a0)}), 3600);
const wdash = new T.InstancedMesh(new T.BoxGeometry(0.35, 0.02, 4), new T.MeshBasicMaterial({color: C(0xf4f4f4)}), 2000);
const lampPole = new T.InstancedMesh(new T.CylinderGeometry(0.1, 0.14, 7, 6), std(0x2b2e33, 0.6, 0.5), 800), lampHead = new T.InstancedMesh(new T.SphereGeometry(0.38, 8, 6), new T.MeshBasicMaterial({color: C(0xffd9a0)}), 800);
for (const m of [dash, wdash, lampPole, lampHead]) { m.count = 0; m.frustumCulled = false; scene.add(m); }
const put = (m, x, z, a) => { o.position.set(x, 0.13, z); o.rotation.set(0, a, 0); o.updateMatrix(); m.setMatrixAt(m.count++, o.matrix); };
for (let k = -N - 1; k <= N; k++) {
  const c = (k + 0.5) * P, r1 = box(14, 0.1, 2 * Rr, roadA, c, 0.05, 0), r2 = box(2 * Rr, 0.1, 14, roadB, 0, 0.06, c); r1.castShadow = r2.castShadow = false; scene.add(r1, r2);
  for (let s = -Rr + 5; s < Rr - 5; s += 9) { put(dash, c, s, 0); put(dash, s, c, Math.PI / 2); }
  for (let l = -N - 1; l <= N; l++) for (const sx of [-8, 8]) for (const sz of [-8, 8]) {
    o.rotation.set(0, 0, 0); o.position.set(c + sx, 3.5, (l + 0.5) * P + sz); o.updateMatrix(); lampPole.setMatrixAt(lampPole.count++, o.matrix);
    o.position.y = 7.1; o.updateMatrix(); lampHead.setMatrixAt(lampHead.count++, o.matrix);
  }
}

// highways: ring road + 4 arms
const hbox = (w, d, x, z, m) => { const r = box(w, 0.12, d, m, x, 0.06, z); r.castShadow = false; scene.add(r); };
const wl = new T.MeshBasicMaterial({color: C(0xf4f4f4)}), yl = new T.MeshBasicMaterial({color: C(0xf2c230)});
function hwLines(cx, cz, len, vert) {
  for (const [off, m] of [[-12.2, wl], [12.2, wl], [-0.35, yl], [0.35, yl]]) { const l = box(vert ? 0.3 : len, 0.02, vert ? len : 0.3, m, vert ? cx + off : cx, 0.125, vert ? cz : cz + off); l.castShadow = false; scene.add(l); }
  for (const off of [-7, 7]) for (let s = -len / 2 + 5; s < len / 2 - 5; s += 9) put(wdash, vert ? cx + off : cx + s, vert ? cz + s : cz + off, vert ? 0 : Math.PI / 2);
}
hbox(2 * Rr + HW, HW, 0, Rr, hwB); hbox(2 * Rr + HW, HW, 0, -Rr, hwB); hbox(HW, 2 * Rr + HW, Rr, 0, hwA); hbox(HW, 2 * Rr + HW, -Rr, 0, hwA);
hwLines(0, Rr, 2 * Rr - HW, false); hwLines(0, -Rr, 2 * Rr - HW, false); hwLines(Rr, 0, 2 * Rr - HW, true); hwLines(-Rr, 0, 2 * Rr - HW, true);
const L2 = R - Rr - HW / 2, mid = Rr + HW / 2 + L2 / 2;
for (const s of [-1, 1]) { hbox(HW, L2, 0, s * mid, hwA); hbox(L2, HW, s * mid, 0, hwB); hwLines(0, s * mid, L2, true); hwLines(s * mid, 0, L2, false); }
function sign(txt) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#0b6b3a'; g.fillRect(0, 0, 512, 128); g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(6, 6, 500, 116);
  g.fillStyle = '#fff'; g.font = 'bold 52px system-ui,sans-serif'; g.textAlign = 'center'; g.fillText(txt, 256, 82);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return std(0xffffff, 0.6, 0, {map: t});
}
const signs = [sign('HIGHWAY A1'), sign('RING ROAD')];
function gantry(cx, cz, vert, si) {
  const g = new T.Group();
  for (const sx of [-14.5, 14.5]) { g.add(box(0.7, 8.5, 0.7, dark, sx, 4.25, 0)); colliders.push({x: vert ? cx + sx : cx, z: vert ? cz : cz + sx, hw: 0.5, hd: 0.5}); }
  g.add(box(30, 0.8, 0.8, dark, 0, 8.2, 0)); g.add(box(10, 3, 0.3, signs[si], -7, 6, 0)); g.add(box(10, 3, 0.3, signs[si], 7, 6, 0));
  g.position.set(cx, 0, cz); g.rotation.y = vert ? 0 : Math.PI / 2; scene.add(g);
}
for (const s of [-1, 1]) { gantry(0, s * (Rr + 200), true, 0); gantry(s * (Rr + 200), 0, false, 0); }
gantry(250, Rr, false, 1); gantry(-250, -Rr, false, 1); gantry(Rr, -250, true, 1); gantry(-Rr, 250, true, 1);

// buildings: glass downtown, mid-rise ring, suburban houses
function tower(x, z) {
  const w = 11 + Math.random() * 5, dd = 11 + Math.random() * 5, h = 45 + Math.random() * 80, m = BM(glassCols[(Math.random() * 3) | 0], 4 + ((Math.random() * 2) | 0)); let y = 0.3;
  for (const [s, f] of [[1, 0.6], [0.78, 0.28], [0.55, 0.12]]) { const th = h * f; addBox(m, w * s, th, dd * s, x, y + th / 2, z, Math.max(1, Math.round(w * s / 12)), Math.max(1, Math.round(th / 14))); y += th; }
  addBox(dark, 0.4, 14, 0.4, x, y + 7, z); addBox(dark, w * 0.3, 1.2, dd * 0.3, x, y + 0.6, z); colliders.push({x, z, hw: w / 2, hd: dd / 2}); fp.push([x, z, w, dd]);
}
function midrise(x, z) {
  const w = 12 + Math.random() * 5, dd = 12 + Math.random() * 5, h = 16 + Math.pow(Math.random(), 1.5) * 30;
  addBox(BM(wallCols[(Math.random() * 6) | 0], (Math.random() * 4) | 0), w, h, dd, x, 0.3 + h / 2, z, Math.max(1, Math.round(w / 10)), Math.max(1, Math.round(h / 14)));
  addBox(dark, w + 0.4, 3.2, dd + 0.4, x, 1.9, z); addBox(dark, w + 0.6, 0.8, dd + 0.6, x, 0.7 + h, z); addBox(dark, w * 0.35, 1.6, dd * 0.3, x + w * 0.15, 1.9 + h, z);
  colliders.push({x, z, hw: w / 2, hd: dd / 2}); fp.push([x, z, w, dd]);
}
function house(x, z) {
  const w = 8 + Math.random() * 3, dd = 8 + Math.random() * 3, h = 5.5 + Math.random() * 2.5;
  addBox(BM(pastel[(Math.random() * 6) | 0], (Math.random() * 4) | 0), w, h, dd, x, 0.3 + h / 2, z, Math.max(1, Math.round(w / 8)), 1);
  addRoof(roofM[(Math.random() * 3) | 0], w * 1.1, dd * 1.1, x, 0.3 + h, z, 3.4); addBox(dark, 0.9, 2.2, 0.9, x + w * 0.25, h + 2.4, z);
  colliders.push({x, z, hw: w / 2, hd: dd / 2}); fp.push([x, z, w, dd]);
}
const slabMat = std(0xbdb9ae, 0.9), lawnM = std(0x6fae5f, 1);
for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) {
  const cx = i * P, cz = j * P, d = Math.max(Math.abs(i), Math.abs(j)), slab = box(40, 0.3, 40, slabMat, cx, 0.15, cz); slab.castShadow = false; scene.add(slab);
  if (d === 0 || (d > 2 && Math.random() < 0.07)) {
    fp.push([cx, cz, 36, 36, 1]); const lawn = box(36, 0.1, 36, lawnM, cx, 0.33, cz); lawn.castShadow = false; scene.add(lawn);
    for (let t = 0; t < 14; t++) tree(cx + (Math.random() - 0.5) * 32, cz + (Math.random() - 0.5) * 32); continue;
  }
  const lots = d > 4 ? [-13, 0, 13] : [-10, 10];
  for (const ox of lots) for (const oz of lots) {
    const x = cx + ox, z = cz + oz;
    if (Math.random() < 0.1) tree(x, z); else if (d <= 2) tower(x, z); else if (d <= 4) midrise(x, z); else house(x, z);
  }
}
groups.forEach((gs, m) => { const mesh = new T.Mesh(merge(gs), m); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); });
// forest around the city
const gr = v => Math.abs(v / P - 0.5 - Math.round(v / P - 0.5)) * P < 10;
const onRoad = (x, z) => (Math.abs(x) < Rr + 14 && Math.abs(z) < Rr + 14 && (gr(x) || gr(z))) || (Math.abs(Math.abs(x) - Rr) < 16 && Math.abs(z) < Rr + 16) || (Math.abs(Math.abs(z) - Rr) < 16 && Math.abs(x) < Rr + 16) || Math.abs(x) < 18 || Math.abs(z) < 18;
for (let t = 0; t < 3000; t++) { const x = (Math.random() - 0.5) * 1120, z = (Math.random() - 0.5) * 1120; if ((Math.abs(x) < CR + 6 && Math.abs(z) < CR + 6) || onRoad(x, z)) continue; tree(x, z); }
leaves.instanceColor.needsUpdate = true;

// minimap / GPS (rotating) + full map (M)
const mm = document.getElementById('mm'), mg = mm.getContext('2d'); mm.width = mm.height = 360;
const W2 = Rr + 60, MS = 2 * W2, ms = document.createElement('canvas'); ms.width = ms.height = MS; const sg = ms.getContext('2d'), X = x => W2 - x, Y = z => W2 - z;
const ln = (a, b, c, d) => { sg.beginPath(); sg.moveTo(X(a), Y(b)); sg.lineTo(X(c), Y(d)); sg.stroke(); };
sg.fillStyle = '#6d9a58'; sg.fillRect(0, 0, MS, MS);
sg.strokeStyle = '#e6e3da'; sg.lineWidth = 14; for (let k = -N - 1; k <= N; k++) { const c = (k + 0.5) * P; ln(c, -Rr, c, Rr); ln(-Rr, c, Rr, c); }
sg.fillStyle = '#bcb8ab'; for (let i = -N; i <= N; i++) for (let j = -N; j <= N; j++) sg.fillRect(X(i * P + 20), Y(j * P + 20), 40, 40);
for (const [x, z, w, d, p] of fp) { sg.fillStyle = p ? '#80b56b' : '#8d8a82'; sg.fillRect(X(x + w / 2), Y(z + d / 2), w, d); }
const hwy = (wd, col) => { sg.strokeStyle = col; sg.lineWidth = wd; sg.strokeRect(X(Rr), Y(Rr), 2 * Rr, 2 * Rr); ln(0, Rr, 0, W2); ln(0, -Rr, 0, -W2); ln(Rr, 0, W2, 0); ln(-Rr, 0, -W2, 0); };
hwy(30, '#ffffff'); hwy(25, '#e8a24a');
function drawMM() {
  const w = mm.width, spd = Math.hypot(S.vx, S.vz); mg.fillStyle = '#6d9a58'; mg.fillRect(0, 0, w, w);
  if (mapBig) { mg.drawImage(ms, 0, 0, w, w); mg.save(); mg.translate(X(S.x) * w / MS, Y(S.z) * w / MS); mg.rotate(-S.h); }
  else { const zm = (w / 300) * (1.2 - Math.min(spd, 80) * 0.006); mg.save(); mg.translate(w / 2, w * 0.62); mg.rotate(S.h); mg.scale(zm, zm); mg.translate(-X(S.x), -Y(S.z)); mg.drawImage(ms, 0, 0); mg.restore(); mg.save(); mg.translate(w / 2, w * 0.62); }
  const u = w / 36; mg.fillStyle = '#e0202f'; mg.strokeStyle = '#fff'; mg.lineWidth = 2; mg.beginPath(); mg.moveTo(0, -u); mg.lineTo(u * 0.7, u * 0.8); mg.lineTo(-u * 0.7, u * 0.8); mg.closePath(); mg.fill(); mg.stroke(); mg.restore();
}

// ---- ramps (gravity playground) ----
const RAMPS = [{x: 27, z: 38, a: 0}, {x: -27, z: -38, a: Math.PI}, {x: -72, z: 27, a: Math.PI / 2}, {x: 72, z: -27, a: -Math.PI / 2}, {x: -200, z: 444.5, a: Math.PI / 2}, {x: 6.5, z: 700, a: 0}].map(r => Object.assign(r, {l: 16, w: 9, h: 4.2}));
RAMPS.forEach(r => {
  const s = new T.Shape(); s.moveTo(0, 0); s.lineTo(r.l, 0); s.lineTo(r.l, r.h); s.closePath();
  const g = new T.ExtrudeGeometry(s, {depth: r.w, bevelEnabled: false}); g.rotateY(-Math.PI / 2); g.translate(r.w / 2, 0, 0);
  const m = new T.Mesh(g, std(0xe0792a, 0.7)); m.position.set(r.x, 0.1, r.z); m.rotation.y = r.a; m.castShadow = m.receiveShadow = true; scene.add(m);
});
function H(x, z) {
  let h = 0.1;
  for (const r of RAMPS) {
    const dx = x - r.x, dz = z - r.z, s = Math.sin(r.a), c = Math.cos(r.a), u = dx * s + dz * c, v = dx * c - dz * s;
    if (u >= 0 && u <= r.l && Math.abs(v) <= r.w / 2) h = Math.max(h, 0.1 + r.h * u / r.l);
  }
  return h;
}

// ---- Porsche 911 ----
const COLORS = [0xc8102e, 0xf2c200, 0x0e4c92, 0xeeeeee, 0x15171a]; let ci = 0;
const paint = new T.MeshPhysicalMaterial({color: C(COLORS[0]), metalness: 0.55, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.2});
const glass = std(0x080b10, 0.06, 0.9), black = std(0x0a0a0a, 0.8);
const car = new T.Group(); car.rotation.order = 'YXZ';
const sh = new T.Shape();
sh.moveTo(2.05, 0.38); sh.lineTo(2.15, 0.5); sh.lineTo(2.14, 0.62); sh.quadraticCurveTo(1.8, 0.75, 1.2, 0.82); sh.lineTo(0.9, 0.86); sh.lineTo(0.3, 1.18); sh.lineTo(-0.3, 1.2);
sh.quadraticCurveTo(-1.2, 1.05, -1.9, 0.8); sh.lineTo(-2.1, 0.76); sh.lineTo(-2.15, 0.55); sh.lineTo(-2.05, 0.38); sh.closePath();
const bg = new T.ExtrudeGeometry(sh, {depth: 1.5, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.1, bevelSegments: 6, curveSegments: 16});
bg.rotateY(-Math.PI / 2); bg.translate(0.75, 0, 0);
const body = new T.Mesh(bg, paint); body.castShadow = true; car.add(body);
const ws = new T.Shape(); ws.moveTo(0.8, 0.9); ws.lineTo(0.28, 1.15); ws.lineTo(-0.3, 1.17); ws.lineTo(-1.25, 0.97); ws.lineTo(-1.2, 0.9); ws.closePath();
const wg = new T.ExtrudeGeometry(ws, {depth: 1.92, bevelEnabled: false}); wg.rotateY(-Math.PI / 2); wg.translate(0.96, 0, 0); car.add(new T.Mesh(wg, glass));
const part = (g, m, x, y, z, rx = 0) => { const p = new T.Mesh(g, m); p.position.set(x, y, z); p.rotation.x = rx; car.add(p); return p; };
part(new T.BoxGeometry(1.45, 0.02, 0.68), glass, 0, 1.108, 0.647, 0.49);
part(new T.BoxGeometry(1.35, 0.02, 0.78), glass, 0, 1.125, -1.15, -0.245);
part(new T.BoxGeometry(1.5, 0.06, 0.3), paint, 0, 0.9, -2.12, -0.15).castShadow = true;
part(new T.BoxGeometry(1.2, 0.14, 0.05), black, 0, 0.45, 2.255);
const lightMat = new T.MeshStandardMaterial({color: C(0xfff4d6), emissive: C(0xfff0c0), emissiveIntensity: 1.2, roughness: 0.1});
const tailMat = new T.MeshStandardMaterial({color: C(0x7a0008), emissive: C(0xff1010), emissiveIntensity: 0.6, roughness: 0.2});
for (const sx of [-1, 1]) {
  const hl = part(new T.SphereGeometry(0.17, 14, 10), lightMat, sx * 0.62, 0.76, 1.93); hl.scale.z = 0.8;
  part(new T.BoxGeometry(0.2, 0.12, 0.1), paint, sx * 0.99, 1.0, 0.75);
}
part(new T.BoxGeometry(1.5, 0.05, 0.05), tailMat, 0, 0.7, -2.27);
const spot = new T.SpotLight(C(0xfff0d0), 2.2, 70, 0.5, 0.6, 1); spot.position.set(0, 0.8, 2.2); spot.target.position.set(0, 0.2, 14); car.add(spot, spot.target);
const tireM = std(0x111111, 0.85), rimM = std(0xc4c8cd, 0.22, 1), spokeM = std(0x2a2d31, 0.5, 0.6), wheels = [];
for (const [x, z] of [[-1, 1.38], [1, 1.38], [-1, -1.32], [1, -1.32]]) {
  const p = new T.Group(), s = new T.Group(), tire = new T.Mesh(new T.CylinderGeometry(0.37, 0.37, 0.3, 24), tireM), rim = new T.Mesh(new T.CylinderGeometry(0.26, 0.26, 0.31, 20), rimM);
  tire.rotation.z = rim.rotation.z = Math.PI / 2; tire.castShadow = true; s.add(tire, rim);
  for (let i = 0; i < 5; i++) for (const sx of [-0.16, 0.16]) { const sp = new T.Mesh(new T.BoxGeometry(0.02, 0.05, 0.46), spokeM); sp.position.x = sx; sp.rotation.x = i * 1.2566; s.add(sp); }
  p.add(s); p.position.set(x * 0.88, 0.37, z); car.add(p); wheels.push({p, s, front: z > 0});
  const arch = new T.Mesh(new T.CircleGeometry(0.41, 20), black); arch.position.set(x * 0.962, 0.39, z); arch.rotation.y = x * Math.PI / 2; car.add(arch);
}
scene.add(car);

// ---- effects: skid marks + tire smoke ----
const skid = new T.InstancedMesh(new T.PlaneGeometry(0.3, 0.9).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2}), 900);
skid.count = 0; skid.frustumCulled = false; scene.add(skid); let skN = 0;
const puffTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  r.addColorStop(0, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(c); })();
const puffs = []; for (let i = 0; i < 60; i++) { const s = new T.Sprite(new T.SpriteMaterial({map: puffTex, transparent: true, depthWrite: false, color: 0xd8d2cc, opacity: 0})); s.visible = false; s.userData = {life: 0}; scene.add(s); puffs.push(s); }
let pn = 0;

// ---- input ----
const keys = {}, touch = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') reset(); if (e.code === 'KeyH') toggleHelp(); if (e.code === 'KeyV') camMode = 1 - camMode; if (e.code === 'KeyM') toggleMap(); if (e.code === 'KeyC') { ci = (ci + 1) % COLORS.length; paint.color.copy(C(COLORS[ci])); } if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k; b.addEventListener('pointerdown', e => { touch[k] = true; e.preventDefault(); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => { touch[k] = false; });
});

// ---- physics ----
let S, camYaw = 0;
function reset() { S = {x: P / 2, z: -20, y: 0.1, h: 0, vx: 0, vz: 0, vy: 0, gvy: 0, air: false, st: 0, yaw: 0, pitch: 0, roll: 0, sy: 0, sv: 0, sk: 0, gear: 1, rpm: 900, thr: 0, brk: 0, shift: 0}; camYaw = 0; }
reset();
const kmh = document.getElementById('kmh');

// ---- realistic drivetrain: 7-speed PDK, torque curve, drag, 308 km/h limiter ----
const GR = [0, 17, 10.9, 7.8, 5.78, 4.59, 3.74, 3.06], MASS = 1500, WR = 0.37, VMAX = 85.5;
const torque = r => r < 1000 ? 250 : r < 2000 ? 250 + (r - 1000) * 0.23 : r < 2500 ? 480 + (r - 2000) * 0.1 : r < 5000 ? 530 : r < 6500 ? 530 - (r - 5000) * 0.033 : 480 - (r - 6500) * 0.114;
let camMode = 0, mapBig = false, ODO = 0, TOP = 0; try { ODO = parseFloat(localStorage.getItem('odo911')) || 0; } catch (e) {}
setInterval(() => { try { localStorage.setItem('odo911', ODO.toFixed(2)); } catch (e) {} }, 3000);
const gearEl = document.getElementById('gear'), rpmFill = document.getElementById('rpmfill'), odoEl = document.getElementById('odo'), helpEl = document.getElementById('help'), hint = document.getElementById('hint');
function toggleHelp() { helpEl.classList.toggle('show'); hint.style.opacity = 0; }
function toggleMap() { mapBig = !mapBig; mm.classList.toggle('big', mapBig); mm.width = mm.height = mapBig ? 640 : 360; }
document.getElementById('hbtn').addEventListener('click', toggleHelp); mm.addEventListener('click', toggleMap); setTimeout(() => { hint.style.opacity = 0; }, 9000);

// cockpit view (V)
const glassParts = car.children.filter(c => c.material === glass), cockpit = new T.Group(), sw = new T.Group(), swt = new T.Group(), Q180 = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), Math.PI);
cockpit.add(box(1.5, 0.22, 0.4, std(0x15161a, 0.7), 0, 0.97, 0.78));
sw.add(new T.Mesh(new T.TorusGeometry(0.17, 0.022, 10, 28), std(0x111111, 0.6))); sw.add(box(0.34, 0.025, 0.02, std(0x111111, 0.6), 0, 0, 0));
swt.add(sw); swt.position.set(0.36, 1.0, 0.5); swt.rotation.x = 0.52; cockpit.add(swt); cockpit.visible = false; car.add(cockpit);

// engine sound
let AC, o1, o2, flt, eg;
function startAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); o1 = AC.createOscillator(); o2 = AC.createOscillator(); o1.type = 'sawtooth'; o2.type = 'square';
    flt = AC.createBiquadFilter(); flt.type = 'lowpass'; eg = AC.createGain(); eg.gain.value = 0; o1.connect(flt); o2.connect(flt); flt.connect(eg); eg.connect(AC.destination); o1.start(); o2.start();
  } catch (e) {}
}
addEventListener('keydown', startAudio, {once: true}); addEventListener('pointerdown', startAudio, {once: true});
function audio() { if (!AC) return; const f = S.rpm / 60 * 3; o1.frequency.value = f; o2.frequency.value = f * 0.5; flt.frequency.value = 400 + S.thr * 1600 + S.rpm * 0.25; eg.gain.value = 0.04 + 0.06 * S.thr; }

function step(dt) {
  const gas = keys.KeyW || keys.ArrowUp || touch.g, brake = keys.KeyS || keys.ArrowDown || touch.b, hb = keys.Space || touch.h;
  const left = keys.KeyA || keys.ArrowLeft || touch.l, right = keys.KeyD || keys.ArrowRight || touch.r;
  S.thr += ((gas ? 1 : 0) - S.thr) * Math.min(1, 6 * dt); S.brk += ((brake ? 1 : 0) - S.brk) * Math.min(1, 9 * dt);
  S.st += ((left ? 1 : 0) - (right ? 1 : 0) - S.st) * Math.min(1, 6 * dt);
  const sn = Math.sin(S.h), cs = Math.cos(S.h);
  let vF = S.vx * sn + S.vz * cs, vL = S.vx * cs - S.vz * sn, slip = 0;
  if (!S.air) {
    if (brake && !gas && vF < 0.5) { vF = Math.max(-9, vF - 3.5 * dt); S.gear = 1; S.rpm = 900 + Math.abs(vF) * 250; }
    else {
      const wr = Math.abs(vF) / WR * 9.549; let g = S.gear; S.shift -= dt;
      S.rpm = Math.max(g === 1 ? 900 + S.thr * 4800 * Math.max(0, 1 - Math.abs(vF) / 14) : 900, wr * GR[g]);
      if (S.shift <= 0) {
        if (S.rpm > 6900 && g < 7 && S.thr > 0.1) { S.gear = g + 1; S.shift = 0.2; }
        else if (g > 1 && (S.rpm < 2400 || (S.thr > 0.85 && S.rpm < 3300 && vF > 3))) { S.gear = g - 1; S.shift = 0.2; }
      }
      g = S.gear;
      let a = S.shift <= 0 ? Math.min(9.3, torque(S.rpm) * GR[g] * 0.9 / WR / MASS * S.thr) : 0;
      a -= (0.372 * vF * Math.abs(vF) + 220 * Math.sign(vF)) / MASS;
      a -= (1 - S.thr) * (0.5 + S.rpm / 3500) * Math.sign(vF);
      if (vF > 0.5) a -= S.brk * 10.5;
      if (hb) a -= Math.sign(vF) * 4;
      const nv = vF + a * dt; vF = (vF > 0 && nv < 0) || (vF < 0 && nv > 0) ? 0 : Math.min(nv, VMAX);
    }
    slip = Math.abs(vL);
    const lim = hb ? 3.5 : 11.2 * (1 - 0.3 * S.thr * (vF < 40 ? 1 : 0) * Math.min(1, Math.abs(S.st) * 1.5));
    vL -= clamp(vL * (1 - Math.exp(-9 * dt)), -lim * dt, lim * dt);
    let yr = S.st * (0.5 / (1 + Math.pow(vF / 8, 2))) * vF / 2.45;
    if (hb && Math.abs(vF) > 6) yr *= 1.8;
    S.yaw += (yr - S.yaw) * Math.min(1, 12 * dt); S.h += S.yaw * dt;
    S.vx = sn * vF + cs * vL; S.vz = cs * vF - sn * vL;
  } else S.h += S.st * dt;

  let nx = S.x + S.vx * dt, nz = S.z + S.vz * dt;
  const nsn = Math.sin(S.h), ncs = Math.cos(S.h);
  for (const off of [1.3, -1.3]) {
    const px = nx + nsn * off, pz = nz + ncs * off;
    for (const c of colliders) {
      if (Math.abs(c.x - px) > c.hw + 1.2 || Math.abs(c.z - pz) > c.hd + 1.2) continue; const qx = clamp(px, c.x - c.hw, c.x + c.hw), qz = clamp(pz, c.z - c.hd, c.z + c.hd), dx = px - qx, dz = pz - qz, d = Math.hypot(dx, dz);
      if (d < 1.05 && d > 0) {
        const p = 1.05 - d, ux = dx / d, uz = dz / d; nx += ux * p; nz += uz * p;
        const vn = S.vx * ux + S.vz * uz; if (vn < 0) { S.vx -= vn * ux * 1.4; S.vz -= vn * uz * 1.4; }
      }
    }
  }
  if (Math.abs(nx) > R + 8) { nx = clamp(nx, -R - 8, R + 8); S.vx = 0; }
  if (Math.abs(nz) > R + 8) { nz = clamp(nz, -R - 8, R + 8); S.vz = 0; }
  const g0 = H(nx, nz);
  if (!S.air) {
    if (g0 - S.y > 0.7) { nx = S.x; nz = S.z; S.vx *= -0.2; S.vz *= -0.2; }
    else if (g0 - S.y < -0.25) { S.air = true; S.vy = S.gvy; }
    else { S.gvy = (g0 - S.y) / dt; S.y = g0; }
  }
  if (S.air) {
    S.vy -= 24 * dt; S.y += S.vy * dt;
    if (S.y <= g0) { if (S.vy < -3) S.sv += S.vy * 0.12; S.y = g0; S.air = false; S.vy = 0; S.gvy = 0; }
  }
  S.x = nx; S.z = nz;
  S.sv += (-120 * S.sy - 10 * S.sv) * dt; S.sy = clamp(S.sy + S.sv * dt, -0.18, 0.1);

  const sp = Math.hypot(S.vx, S.vz), fn = Math.sin(S.h), fc = Math.cos(S.h);
  const tp = S.air ? Math.atan2(S.vy, sp + 1) : Math.atan2(H(S.x + fn * 1.4, S.z + fc * 1.4) - H(S.x - fn * 1.4, S.z - fc * 1.4), 2.8);
  S.pitch += (tp + (gas ? 0.025 : 0) - (brake && vF > 1 ? 0.045 : 0) - S.pitch) * Math.min(1, 6 * dt);
  S.roll += (clamp(S.yaw * vF * 0.0035, -0.09, 0.09) - S.roll) * Math.min(1, 6 * dt);
  car.position.set(S.x, S.y + S.sy, S.z); car.rotation.set(-S.pitch, S.h, S.roll);
  for (const w of wheels) { w.s.rotation.x += vF * dt / 0.37; if (w.front) w.p.rotation.y = S.st * 0.4; }
  tailMat.emissiveIntensity = (brake && vF > 0.5) || hb ? 2.6 : 0.6;

  // skid marks and smoke
  const sliding = !S.air && ((sp > 6 && (slip > 3.2 || (hb && sp > 8))) || (gas && S.gear === 1 && S.rpm > 5200 && sp > 1 && sp < 13));
  S.sk += sp * dt;
  while (S.sk > 0.45) {
    S.sk -= 0.45;
    if (!sliding) continue;
    const yaw = Math.atan2(S.vx, S.vz); let side = 1;
    for (const sx of [-0.88, 0.88]) {
      const wx = S.x + sx * fc - 1.32 * fn, wz = S.z - sx * fn - 1.32 * fc;
      if (S.y < 0.3) { o.position.set(wx, 0.14, wz); o.rotation.set(0, yaw, 0); o.updateMatrix(); skid.setMatrixAt(skN % 900, o.matrix); skN++; skid.count = Math.min(skN, 900); skid.instanceMatrix.needsUpdate = true; }
      if (side++ === 1 || Math.random() < 0.5) { const s = puffs[pn++ % 60]; s.position.set(wx, S.y + 0.3, wz); s.userData = {life: 1, vx: S.vx * 0.2, vz: S.vz * 0.2}; s.visible = true; }
    }
  }
  for (const s of puffs) if (s.visible) {
    const u = s.userData; u.life -= dt * 1.1; if (u.life <= 0) { s.visible = false; continue; }
    s.position.x += u.vx * dt; s.position.z += u.vz * dt; s.position.y += dt * 0.9; s.scale.setScalar(1 + (1 - u.life) * 3.5); s.material.opacity = 0.45 * u.life;
  }

  // camera
  let d = S.h - camYaw; d = Math.atan2(Math.sin(d), Math.cos(d)); camYaw += d * Math.min(1, 4 * dt);
  const cx = Math.sin(camYaw), cz = Math.cos(camYaw), dist = 8 + sp * 0.04, shk = sp * 0.0012;
  glassParts.forEach(g => { g.visible = !camMode; }); cockpit.visible = !!camMode; sw.rotation.z = S.st * 2.6;
  if (!camMode) {
    cam.position.set(S.x - cx * dist + (Math.random() - 0.5) * shk, cam.position.y + (S.y + 3.2 + sp * 0.008 - cam.position.y) * Math.min(1, 6 * dt), S.z - cz * dist + (Math.random() - 0.5) * shk);
    cam.lookAt(S.x + cx * 3, S.y + 1, S.z + cz * 3); cam.fov = 62 + Math.min(sp, 85) * 0.2;
  } else {
    car.updateMatrixWorld(); cam.position.copy(car.localToWorld(new T.Vector3(0.36, 1.12, 0.15))); cam.quaternion.copy(car.quaternion).multiply(Q180); cam.fov = 72 + Math.min(sp, 85) * 0.1;
  }
  cam.updateProjectionMatrix();
  sky.position.copy(cam.position);
  sun.position.copy(SUN).multiplyScalar(150).add(car.position); sun.target.position.copy(car.position);
  ODO += sp * dt / 1000; TOP = Math.max(TOP, sp * 3.6);
  kmh.textContent = Math.round(sp * 3.6); gearEl.textContent = vF < -0.3 ? 'R' : (Math.abs(vF) < 0.3 && !gas ? 'N' : S.gear);
  rpmFill.style.width = clamp((S.rpm - 900) / 6300 * 100, 2, 100) + '%'; rpmFill.style.background = S.rpm > 6600 ? '#ff3b30' : '#5ee28a';
  odoEl.textContent = 'Odometer ' + ODO.toFixed(1) + ' km · top speed ' + Math.round(TOP) + ' km/h'; audio();
}
const clock = new T.Clock();
(function loop() { requestAnimationFrame(loop); step(Math.min(clock.getDelta(), 0.05)); drawMM(); renderer.render(scene, cam); })();
</script>
